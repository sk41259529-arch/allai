<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALL AI - Images & Vidéos</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Arial;background:#0f0f1a;color:white;text-align:center}
header{padding:20px;background:linear-gradient(90deg,#7c3aed,#db2777);font-size:28px;font-weight:900}
.tabs{display:flex;justify-content:center;gap:10px;margin:15px}
.tabs button{padding:12px 20px;border:none;border-radius:20px;font-weight:900;cursor:pointer;background:#222;color:white}
.tabs button.active{background:white;color:black}
.box{background:#1a1a2e;margin:15px auto;padding:20px;border-radius:20px;max-width:600px}
input{width:100%;padding:14px;border-radius:12px;border:none;font-size:16px;margin-bottom:10px;color:black}
.btn{width:100%;padding:15px;border:none;border-radius:12px;background:linear-gradient(90deg,#7c3aed,#db2777);color:white;font-size:18px;font-weight:900;cursor:pointer}
img,video{width:100%;border-radius:15px;margin-top:15px;background:#000}
.small{font-size:13px;opacity:.7;margin-top:10px}
</style>
</head>
<body>
<header>🤖 ALL AI</header>
<p>Ton IA qui crée Images & Vidéos</p>
<div class="tabs">
<button id="bImg" class="active" onclick="showTab('img')">🎨 Images</button>
<button id="bVid" onclick="showTab('vid')">🎬 Vidéos</button>
</div>

<div id="tab-img" class="box">
<h2>🎨 Générateur d'Images</h2>
<input id="imgPrompt" placeholder="Ex: un chat mignon en fruit...">
<button class="btn" onclick="genImage()">✨ Générer l'image</button>
<p id="imgStatus"></p>
<img id="imgResult" style="display:none">
<a id="imgDl" style="display:none" download="allai-image.jpg"><button class="btn" style="margin-top:10px;background:#22c55e">⬇️ Télécharger l'image</button></a>
</div>

<div id="tab-vid" class="box" style="display:none">
<h2>🎬 Générateur de Vidéos</h2>
<input id="vidPrompt" placeholder="Ex: un chat qui danse...">
<button class="btn" onclick="genVideo()">🎬 Générer la vidéo</button>
<p id="vidStatus"></p>
<video id="vidResult" controls style="display:none" loop autoplay muted playsinline></video>
<a id="vidDl" style="display:none" download="allai-video.webm"><button class="btn" style="margin-top:10px;background:#22c55e">⬇️ Télécharger la vidéo</button></a>
<p class="small">La vidéo est créée à partir de ton image, avec un effet de mouvement cinéma de 5 secondes.</p>
</div>

<script>
function showTab(t){
document.getElementById('tab-img').style.display=t==='img'?'block':'none';
document.getElementById('tab-vid').style.display=t==='vid'?'block':'none';
document.getElementById('bImg').className=t==='img'?'active':'';
document.getElementById('bVid').className=t==='vid'?'active':'';
}
function genImage(){
let p=document.getElementById('imgPrompt').value.trim();
if(!p) return alert('Écris quelque chose !');
let url='https://image.pollinations.ai/prompt/'+encodeURIComponent(p+' , high quality, detailed, beautiful')+'?width=1024&height=1024&seed='+Math.floor(Math.random()*99999)+'&nologo=true';
document.getElementById('imgStatus').textContent='⏳ Génération...';
let img=document.getElementById('imgResult');
img.onload=()=>{document.getElementById('imgStatus').textContent='✅ Voilà ton image pour : '+p; let a=document.getElementById('imgDl'); a.href=url; a.style.display='block';};
img.src=url; img.style.display='block';
}
async function genVideo(){
let p=document.getElementById('vidPrompt').value.trim();
if(!p) return alert('Écris quelque chose pour ta vidéo !');
document.getElementById('vidStatus').textContent='⏳ Je crée ton image... puis je l\'anime en vidéo (5 sec)...';
let url='https://image.pollinations.ai/prompt/'+encodeURIComponent(p+' , cinematic, high quality, video frame')+'?width=1024&height=1024&seed='+Math.floor(Math.random()*99999)+'&nologo=true';
let img=new Image(); img.crossOrigin='anonymous';
img.onload=()=>{
let canvas=document.createElement('canvas'); canvas.width=768; canvas.height=768;
let ctx=canvas.getContext('2d');
let stream=canvas.captureStream(30);
let rec=new MediaRecorder(stream,{mimeType:'video/webm'});
let chunks=[];
rec.ondataavailable=e=>{if(e.data.size) chunks.push(e.data)};
rec.onstop=()=>{
let blob=new Blob(chunks,{type:'video/webm'});
let vurl=URL.createObjectURL(blob);
let v=document.getElementById('vidResult'); v.src=vurl; v.style.display='block';
let a=document.getElementById('vidDl'); a.href=vurl; a.style.display='block';
document.getElementById('vidStatus').textContent='✅ Voilà ta vidéo pour : '+p;
};
rec.start();
let start=Date.now();
function draw(){
let t=(Date.now()-start)/5000;
if(t>=1){rec.stop(); return;}
let zoom=1 + t*0.25;
let w=canvas.width*zoom, h=canvas.height*zoom;
let x=(canvas.width-w)/2 + Math.sin(t*3)*20;
let y=(canvas.height-h)/2;
ctx.drawImage(img,x,y,w,h);
requestAnimationFrame(draw);
}
draw();
};
img.onerror=()=>{document.getElementById('vidStatus').textContent='❌ Réessaie, l\'image n\'a pas chargé.'};
img.src=url;
}
</script>
</body>
</html>
